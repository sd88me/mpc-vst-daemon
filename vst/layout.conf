# Daemon skin: amber phosphor on black, cyan for what the machine says. Rendered by the browser renderer (vst.json "art": "html",
# skin.css). What the user works with while turning Q-Links stays left of x ~1025 (the sidebar slides over the rest); the right column holds the face and the buttons used between Q-Link turns.
label_scale=1.05
scale_names=1
art_css=skin.css
theme_bg=0b0804
theme_panel=120d06
theme_line=7a4c0c
theme_ink=ffb02a
theme_ink_dim=8a5a10
theme_ink_faint=4a300a
theme_accent=19e0ff
theme_accent_hi=8cf0ff
theme_knob_face=1a1208
theme_knob_ring=ffb02a
theme_bar=7a4c0c
theme_seg_active=ffb02a
theme_seg_inactive=1a1208
theme_seg_active_tx=0b0804
theme_btn_text=ffb02a
theme_well=050301
theme_knob_off=4a300a
theme_knob_dot=19e0ff
theme_tab_on=1a1208
theme_lcd=050301
theme_box=120d06
theme_btn_bg=1a1208
theme_chrome_ink=ffb02a
theme_go_on=19e0ff
theme_go_off=4a300a
theme_tabs=7a4c0c

